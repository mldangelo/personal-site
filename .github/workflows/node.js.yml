name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The single build-matrix leg whose output is deployed. Named once so the
  # Pages-configure gate and the artifact-upload gate cannot drift apart —
  # they are a pair, and a mismatch produces a green CI run with nothing to
  # deploy. Must stay in step with .nvmrc; the build job asserts that.
  DEPLOY_NODE: '26.x'

# Supersede stale PR runs, but never cancel a main run that may already be
# deploying. The Pages job below serializes main deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Shared job for installing dependencies with caching
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

  # Lint, format, and type check
  code-quality:
    name: Code Quality
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '.nvmrc') }}

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Verify generated share card
        run: npm run og:check

  # Run tests
  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '.nvmrc') }}

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Build on multiple OS and Node versions
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Configure Pages only reads the existing site metadata. Application and
    # dependency code must never run with Pages write permissions.
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the version .nvmrc
        # pins for development and the rest of CI.
        node-version: [22.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Reduce matrix size for faster CI. Non-Linux runners only need to
          # prove the build is portable, so they run the deployed version.
          - os: windows-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Everything except this job takes its Node from .nvmrc, but a matrix
      # needs literals. If the two drift, the deploy leg stops being built and
      # main fails only after CI reports success. Catch it here, on the PR.
      - name: Check deploy candidate matches .nvmrc
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pinned="$(tr -d 'v[:space:]' < .nvmrc | cut -d. -f1)"
          wanted="${DEPLOY_NODE%%.*}"
          if [ "$pinned" != "$wanted" ]; then
            echo "::error file=.nvmrc::.nvmrc pins Node $pinned but DEPLOY_NODE is $DEPLOY_NODE. Update both, and the build matrix."
            exit 1
          fi
          echo "Deploy candidate Node $wanted matches .nvmrc."

      # This matrix entry becomes the deployment candidate on main. Pages
      # configuration has to run before Next builds so repository-site forks
      # receive their basePath in generated links and assets.
      - name: Configure GitHub Pages build
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == env.DEPLOY_NODE &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          static_site_generator: next
          enablement: false

      # Stats use the public API anonymously, with a labeled fallback on rate
      # limits. Do not expose a job token to application/dependency code.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ vars.NEXT_PUBLIC_GA_TRACKING_ID }}

      - name: Verify static export
        shell: bash
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found. Static export may have failed."
            exit 1
          fi
          echo "Static export successful. Found $(find out -type f | wc -l) files."

      # Checks generated HTML/XML itself: leaked drafts, robots, duplicate ids,
      # fragment and route targets, canonical/share metadata, local images, and
      # sitemap/RSS integrity. None of these are visible to component tests.
      - name: Verify export
        run: npm run verify-export

      - name: Upload build artifacts
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == env.DEPLOY_NODE &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-output
          path: out/
          include-hidden-files: true
          retention-days: 7

  # Summary job to ensure all checks pass
  ci-success:
    name: CI Success
    needs: [code-quality, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" || 
                "${{ needs.test.result }}" != "success" || 
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  # Publish exactly the Linux/DEPLOY_NODE artifact that passed the complete CI
  # graph. Manual runs are intentionally deployable only from main.
  deploy:
    name: Deploy to GitHub Pages
    needs: ci-success
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output
          path: out

      - name: Package GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
